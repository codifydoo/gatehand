name: Claude Code Review
# QUOTED, and it has to stay that way: ` #` in an unquoted plain scalar opens a YAML comment, so
# the bare form silently parsed to "Claude review of PR" and dropped the expression entirely. That
# was survivable while this workflow was dispatch-only and ran rarely; with the automatic trigger
# below, an Actions list of identically-named runs has no way to say which PR each belongs to.
run-name: 'Claude review of PR #${{ inputs.pr || github.event.pull_request.number }}'

# The Claude review every PR gets, and the verdict the agents' merge gate reads
# (.github/scripts/agent-merge.sh): one summary comment carrying the review marker (REVIEW_MARKER
# below), whose Approve or Request changes line is that verdict. /verify-pr writes it as its final
# message, with no token that can write; a step after it posts it as the Claude App (#1147).
#
# Runs on PR open and on a draft being marked ready. NOT on `synchronize`: it is not a required check,
# so a run per push would spend a runner on output nothing gates on. The fixer and the merge gate
# dispatch a fresh review themselves when a new head needs one (agent-state.sh request_review).
#
# DE-DUP: an automatic run skips when the PR already carries a review comment from the review bot, so
# draft -> ready -> draft -> ready reviews once. The gate is here, not in /verify-pr: it is
# deterministic and costs no tokens. A DISPATCH is exempt on purpose: it is a person (or the agents)
# asking for a fresh review.
#
# A FORK's PR is not reviewed here. A dispatch refuses it before anything from the PR is on disk (the
# fork guard step): the review runs the PR's own .github/actions and .claude/ with this job's OIDC
# token and the Claude credential in reach. The automatic run skips it too, but only as a courtesy:
# on `pull_request` GitHub runs the PR's own copy of this file, which a fork can edit. What keeps
# that run harmless is GitHub's fork downgrade (no secrets, a read-only GITHUB_TOKEN), not this
# file, and only while a private repository's "Fork pull request workflows" settings send neither
# write tokens nor secrets. Fork code still runs on the review runner, so a public repository with
# a self-hosted review runner should choose "Require approval for all external contributors"
# (Settings, Actions, General); the default asks only for first-time contributors.
#
# Dispatch by hand, for a PR from a branch of this repository: gh workflow run "Claude Code Review" -f pr=<number>
on:
  pull_request:
    # NOT `synchronize` — see the header. `opened` and `ready_for_review` are the two moments a
    # review is worth its cost.
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review'
        required: true
        type: string

jobs:
  claude-review:
    runs-on: @@RUNS_ON_REVIEW@@
    env:
      # THE marker, defined once for the whole job. It was spelled twice — inline in the baseline
      # step's jq and again in the assert step — each pinned by its own test but never compared to
      # the other, so changing one and not the other left de-dup silently never firing while every
      # test stayed green. .claude/commands/verify-pr.md must emit this exact string;
      # Gatehand's tests/commands/verify-pr.test.sh reads THIS line and checks the command against it.
      REVIEW_MARKER: '<!-- verify-pr-review -->'
      REVIEW_BOT: '@@REVIEW_BOT_LOGIN@@'
    # GitHub fires `opened` for DRAFT PRs too. Until now that case was caught inside the
    # code-review plugin's own step 1, which this workflow no longer uses — so the guard has to be
    # here. Better placed anyway: the skip is visible in the workflow instead of being emergent
    # behaviour of a third-party command.
    # A fork's PR gets no secrets, so a review of it could only fail: it is skipped instead. A
    # dispatch has no pull_request payload for this to read; the fork guard step refuses it there.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    # A hung review holds its runner until this fires; on a small self-hosted review pool every later
    # PR queues behind it.
    timeout-minutes: 30
    # This token is the model's (the review step hands it over as github_token), so it is
    # read-only. The comment goes out with the Claude App token, which the post step mints from
    # this job's OIDC token after the model has exited. id-token: write is that step's: its request
    # values are in every step's environment, the model's too, which can neither read its
    # environment (reads stop at the checkout) nor make a request of its own (no network tool, no
    # `gh api`).
    outputs:
      skipped: ${{ steps.assert.outputs.skipped }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      # THE FORK GUARD: a dispatch for a fork's PR stops here, before the checkout below puts the
      # PR's head on disk. The steps after it run that tree's ./.github/actions/install-gh and read
      # its .claude/ (settings, /verify-pr) with this job's OIDC token (which mints the Claude App
      # token) and with the Claude credential in later steps' reach. From a branch of this repository that is code
      # from someone who could push here anyway; from a fork it is anyone's. To review a fork's PR,
      # read it, push its head to a branch here, and open a PR from that branch.
      # curl and jq, not gh: gh comes from install-gh, which needs the checkout this step guards.
      - name: refuse a fork's PR
        id: fork_guard
        if: github.event_name == 'workflow_dispatch'
        env:
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${PR}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr must be a PR number, not '${PR}'"; exit 1; }
          # The token goes to curl as config on stdin, never in argv.
          head="$(printf 'header = "Authorization: Bearer %s"\n' "${TOKEN}" \
            | curl -K - -fsSL --retry 3 --retry-all-errors --retry-delay 5 \
              -H 'Accept: application/vnd.github+json' "${GITHUB_API_URL}/repos/${REPO}/pulls/${PR}" \
            | jq -r '.head.repo.full_name // ""')"
          if [[ "${head}" != "${REPO}" ]]; then
            echo "::error::PR #${PR} comes from ${head:-a deleted fork}, not ${REPO}. A review runs the PR's own .github/actions and .claude/ with this job's tokens, so a fork's PR is not reviewed. Read it, push its head to a branch of ${REPO}, and review the PR from that branch."
            exit 1
          fi
          echo "PR #${PR} is from a branch of ${REPO}"

      # On a dispatch, check out the PR being reviewed. Without `ref:` a dispatch checks out the
      # ref it was run on (main), so the agent judged the PR's diff while every file it opened for
      # context was main's older copy ("checked against the code on the base branch"). The PR's HEAD, not its merge ref: refs/pull/N/merge is missing while
      # the PR conflicts, and the dispatch is the button pressed to re-review exactly then.
      # An automatic run passes '' here and keeps checkout's default, refs/pull/N/merge.
      # This runs the PR's own .github/actions/install-gh on a dispatch too, which the automatic
      # run has always done; .github/agents/protected-paths.txt is what keeps agent PRs out of it,
      # and the fork guard above is what keeps a fork's PR from reaching it.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/head', inputs.pr) || '' }}
          fetch-depth: 1

      # A bare self-hosted runner image ships no `gh`. See the action for the full reasoning and the
      # pin; every workflow that needs gh uses it, so the copies cannot drift.
      # Must come after checkout: it is a local action, read from the workspace.
      - uses: ./.github/actions/install-gh

      # Installation is only half of what the review needs. An unauthenticated `gh` looks
      # identical to a missing one: a green check and no review. The action prints the version;
      # this proves the token actually works before a billed review depends on it.
      - name: gh auth status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth status
      - name: record newest PR comment before the review
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same `inputs.pr || event` fallback as run-name and the prompt: this must work on the
          # workflow_dispatch path too, where there is no pull_request event payload.
          PR: ${{ inputs.pr || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Comment ids increase monotonically per repository, so "highest id seen before" is a
          # sufficient watermark and needs no timestamp parsing. `--paginate` matters: a PR with
          # more than 100 comments would otherwise watermark at the end of page one and every
          # later comment would read as "new". `${latest:-0}` covers a PR with no comments at all,
          # where the jq filter emits nothing and `tail -1` returns the empty string.
          # One fetch, two answers. `already_reviewed` is what stops a repeat review: the
          # code-review plugin this workflow replaced suppressed a review when the PR already
          # carried a Claude comment, and /verify-pr has no equivalent, so a PR toggled
          # draft -> ready -> draft -> ready used to get two full reviews. Deriving it from the
          # SAME response the watermark already needs keeps this at one API call.
          #
          # REVIEW_MARKER comes from the job-level env above — one definition, read by this step
          # and by the assert step, so the two cannot disagree.
          #
          # Only a marker in a comment by the review bot (REVIEW_BOT, policy.json reviewBotLogin)
          # counts as "already reviewed": anyone can comment on a PR, and a pasted marker would
          # otherwise suppress the automatic review. A review posted under another login just means
          # a second review, which fails safe. The watermark still counts every comment.
          rows="$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --paginate -X GET -f per_page=100 \
            --jq ".[] | [.id, (.user.login == \"${REVIEW_BOT}\" and ((.body // \"\") | contains(\"${REVIEW_MARKER}\")))] | @tsv")"
          latest="$(printf '%s\n' "${rows}" | cut -f1 | sort -n | tail -1)"
          # `if`, not `&&`: under `set -e` a bare `cmd && var=true` exits the step when cmd finds
          # nothing, which is the common no-prior-review case.
          reviewed=false
          if printf '%s\n' "${rows}" | cut -f2 | grep -qx true; then reviewed=true; fi
          echo "id=${latest:-0}" >> "$GITHUB_OUTPUT"
          echo "already_reviewed=${reviewed}" >> "$GITHUB_OUTPUT"
          echo "newest comment id on PR #${PR} before the review: ${latest:-none}"
          echo "a /verify-pr review already exists on PR #${PR}: ${reviewed}"

      # THE PROBE, and the only reason the review step below can be skipped for free. The comment is
      # posted with the Claude App token (the review bot's login, which the dedup above, the merge
      # gate and the fixer read), minted by exchanging this job's OIDC token at Anthropic, as
      # claude-code-action itself does when it is given no github_token. That exchange refuses when
      # this file differs from the default branch's copy ("workflow validation"), which is exactly
      # the PR that edits it. Asking before the review means such a PR costs nothing, as when the
      # action did the exchange itself. The token is revoked at once: nothing holds it while the
      # model runs. The gate is the de-dup gate, verbatim, and the assert step's MUST stay identical
      # to it; Gatehand's tests/workflows/review-dedup.test.sh pins the two together.
      - name: probe the Claude App token exchange
        id: probe
        if: github.event_name == 'workflow_dispatch' || steps.baseline.outputs.already_reviewed != 'true'
        run: |
          set -euo pipefail
          # The two request values go to curl as config on stdin, never in argv.
          oidc="$(printf 'header = "Authorization: bearer %s"\nurl = "%s&audience=claude-code-github-action"\n' \
            "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?the job needs id-token: write}" "${ACTIONS_ID_TOKEN_REQUEST_URL:?}" \
            | curl -K - -fsS --retry 3 --retry-all-errors --retry-delay 5 | jq -r '.value // empty')"
          [[ -n "${oidc}" ]] || { echo "::error::no OIDC token from the runner"; exit 1; }
          echo "::add-mask::${oidc}"
          code=0
          resp="$(printf 'header = "Authorization: Bearer %s"\nheader = "Content-Type: application/json"\n' "${oidc}" \
            | curl -K - -sS --retry 3 --retry-delay 5 -o - -w '\n%{http_code}' -X POST \
              --data '{"permissions":{"pull_requests":"write"}}' \
              'https://api.anthropic.com/api/github/github-app-token-exchange')" || code=$?
          [[ "${code}" -eq 0 ]] || { echo "::error::the Claude App token exchange could not be reached (curl ${code})"; exit 1; }
          status="${resp##*$'\n'}"
          json="${resp%$'\n'*}"
          if [[ "${status}" == 200 ]]; then
            tok="$(jq -r '.token // .app_token // empty' <<<"${json}")"
            [[ -n "${tok}" ]] || { echo "::error::the token exchange answered 200 with no token"; exit 1; }
            echo "::add-mask::${tok}"
            printf 'header = "Authorization: Bearer %s"\n' "${tok}" \
              | curl -K - -sS -o /dev/null -X DELETE -H 'Accept: application/vnd.github+json' "${GITHUB_API_URL}/installation/token" || true
            echo "valid=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          err="$(jq -r '(.error.details.error_code // "") + " " + (.error.message // "") + " " + (.message // "")' <<<"${json}" 2>/dev/null | tr '[:upper:]' '[:lower:]' || true)"
          if [[ "${err}" == *workflow_not_found_on_default_branch* || ( "${status}" == 401 && "${err}" == *"workflow validation failed"* ) ]]; then
            echo "::notice title=Review skipped::this workflow differs from the default branch's copy, so the Claude App will not post for it and the review is not run."
            echo "valid=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::the Claude App token exchange answered ${status}; nothing was reviewed"
          exit 1

      - name: Run Claude Code Review
        id: claude-review
        # Only when the probe says the review can be posted; it carries the de-dup gate.
        if: steps.probe.outputs.valid == 'true'
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          @@CLAUDE_AUTH@@
          # LOAD-BEARING for the autonomous agents. The action refuses any non-User actor not named
          # here (src/github/validation/actor.ts, checkHumanActor), and a PR the coder agent opens has
          # the actor `@@BOT_SLUG@@[bot]`. Without this line every agent PR would get NO review: the
          # step throws before Claude starts, and the review is the only qualitative gate before an
          # agent PR merges. One name, not `*`: allowed bots skip the write-permission check.
          allowed_bots: @@BOT_SLUG@@
          # THE MODEL HOLDS NO WRITE TOKEN. It reads text the PR's author wrote: on an agent PR, a
          # coder model steered by issue text that anyone who can open an issue may have written.
          # With no github_token the action mints the Claude App token (contents, issues and
          # pull_requests write) and hands it to the model as GH_TOKEN; a review that followed
          # planted text could then post anything anywhere, or hand the token out. This job's own
          # token is read-only (see `permissions:`), and the action uses it as given. The review
          # comes back as the model's final message, and the next step posts it.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: '/verify-pr ${{ inputs.pr || github.event.pull_request.number }}'
          # Reads stop at the checkout, so /proc/self/environ (the Claude credential), $HOME and
          # $RUNNER_TEMP are out of reach; `Read(//proc/**)` says it again in case the setting goes.
          # `Edit(//**)` denies every file write, including a shell redirect (Claude Code checks one
          # against Edit rules), and deny beats any allow in the PR's own .claude/settings.json. The
          # model writes nothing at all: a write would be a way to steer the posting step after it
          # (GITHUB_ENV, BASH_ENV) or, on a self-hosted runner, a later job.
          settings: |
            {"permissions": {"blockReadsOutsideWorkingDirectories": true, "deny": ["Read(//proc/**)", "Edit(//**)"]}}
          # --allowedTools ALLOWS; it does not RESTRICT. In agent mode the action appends claude_args
          # to the CLI verbatim and adds no list of its own (src/modes/agent/index.ts), so a tool the
          # command needs and this line omits is not granted BY THE ACTION. Keep it equal to the
          # frontmatter of .claude/commands/verify-pr.md; Gatehand's tests/commands/verify-pr.test.sh
          # asserts they agree.
          #
          # The flag does not bound the grant: the checkout puts the PR's `.claude/settings.json` in
          # the workspace and Claude Code loads it, so the effective grant is this flag, that file's
          # `permissions.allow` and the command's frontmatter together. --disallowedTools is what
          # bounds it: it maps onto `deny`, and deny beats allow from every scope. Bash rules are
          # SCOPED (`Bash(git:*)`), never a bare `Bash`, which would take the `gh` reads with it.
          # Write, Edit and NotebookEdit are denied by name, so the tools are gone, and so are
          # `gh pr comment`, `gh pr review` and `gh api`: the review posts nothing itself. The
          # network tools are denied so that it cannot send anything out, and git, the package
          # managers, build tools and interpreters so that a repo's settings cannot quietly widen
          # this job: it reads a diff and writes one message, and needs none of them.
          #
          # No Task: /verify-pr is a single-pass review.
          # MODEL, set explicitly (policy.json roles.review.model, rendered here): without --model
          # the CLI default applies, which can be a smaller model than the one the merge gate is
          # meant to trust. Gatehand's tests/commands/verify-pr.test.sh pins it. claude-code-action installs its
          # own pinned CLI, so after changing the model, dispatch a review and check that the agent
          # step ran more than one turn before trusting it: a model the CLI does not know dies on its
          # first request with no comment.
          claude_args: |
            --model @@REVIEW_MODEL@@
            --allowedTools "Read,Grep,Glob,TodoWrite,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh search:*)"
            --disallowedTools "Write,Edit,NotebookEdit,Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh api:*),Bash(pnpm:*),Bash(npm:*),Bash(npx:*),Bash(yarn:*),Bash(bun:*),Bash(go:*),Bash(gofmt:*),Bash(cargo:*),Bash(pip:*),Bash(uv:*),Bash(python:*),Bash(python3:*),Bash(node:*),Bash(make:*),Bash(git:*),Bash(docker:*),Bash(curl:*),Bash(wget:*),WebFetch,WebSearch"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # THE POST. The model has exited; this step, which runs no model, posts what it said. The
      # review is the model's final message (the `result` of its execution file), from the marker
      # line on: /verify-pr puts the marker first, so anything before it is not the review. The
      # target is this run's PR, never one the text names. A review that is missing, oversized or
      # carries something shaped like a credential is not posted, and the assert step then reddens
      # the job. The token is minted here, used for one comment and revoked; it never existed while
      # the model ran.
      - name: post the review
        id: post
        if: steps.claude-review.outputs.execution_file != ''
        env:
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "${PR}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr must be a PR number, not '${PR}'"; exit 1; }
          body="$(mktemp)"
          jq -r '[.[]? | select(.type? == "result")] | last | .result // empty' "${EXECUTION_FILE}" \
            | tr -d '\r' | awk -v m="${REVIEW_MARKER}" 'on || index($0, m) == 1 { on = 1; print }' >"${body}"
          if [[ ! -s "${body}" ]]; then
            echo "::error title=Review posted nothing::the review's final message carries no line starting with ${REVIEW_MARKER}, so there is nothing to post."
            exit 1
          fi
          if [[ "$(wc -c <"${body}" | tr -d ' ')" -gt 60000 ]]; then
            echo "::error title=Review not posted::the review is over 60000 bytes; nothing was posted."
            exit 1
          fi
          # Shapes of the credentials a review job could reach. A real review has no reason to
          # carry one, and a review that does is posting a secret.
          if grep -qE 'sk-ant-[A-Za-z0-9_-]{8}|gh[opsur]_[A-Za-z0-9]{20}|github_pat_[A-Za-z0-9_]{20}|-----BEGIN [A-Z ]*PRIVATE KEY|ACTIONS_(ID_TOKEN_REQUEST|RUNTIME)_TOKEN|eyJ[A-Za-z0-9_-]{20,}\.eyJ' "${body}"; then
            echo "::error title=Review not posted::the review carries text shaped like a credential, so it was not posted. Read the run's execution file before trusting this PR."
            exit 1
          fi
          oidc="$(printf 'header = "Authorization: bearer %s"\nurl = "%s&audience=claude-code-github-action"\n' \
            "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?the job needs id-token: write}" "${ACTIONS_ID_TOKEN_REQUEST_URL:?}" \
            | curl -K - -fsS --retry 3 --retry-all-errors --retry-delay 5 | jq -r '.value // empty')"
          [[ -n "${oidc}" ]] || { echo "::error::no OIDC token from the runner"; exit 1; }
          echo "::add-mask::${oidc}"
          tok="$(printf 'header = "Authorization: Bearer %s"\nheader = "Content-Type: application/json"\n' "${oidc}" \
            | curl -K - -fsS --retry 3 --retry-all-errors --retry-delay 5 -X POST \
              --data '{"permissions":{"pull_requests":"write"}}' \
              'https://api.anthropic.com/api/github/github-app-token-exchange' | jq -r '.token // .app_token // empty')"
          [[ -n "${tok}" ]] || { echo "::error::the Claude App token exchange gave no token; nothing was posted"; exit 1; }
          echo "::add-mask::${tok}"
          revoke() {
            printf 'header = "Authorization: Bearer %s"\n' "${tok}" \
              | curl -K - -sS -o /dev/null -X DELETE -H 'Accept: application/vnd.github+json' "${GITHUB_API_URL}/installation/token" || true
          }
          trap revoke EXIT
          jq -n --rawfile b "${body}" '{body: $b}' >"${body}.json"
          printf 'header = "Authorization: Bearer %s"\n' "${tok}" \
            | curl -K - -fsS -o /dev/null -X POST -H 'Accept: application/vnd.github+json' \
              --data-binary "@${body}.json" "${GITHUB_API_URL}/repos/${REPO}/issues/${PR}/comments"
          echo "posted the review on PR #${PR}"

      # I3 ASSERTION — the other half of the baseline step near the top of this job. DO NOT DELETE
      # THIS AS REDUNDANT WITH Gatehand's tests/commands/verify-pr.test.sh. That suite is static analysis: it
      # proves the command file still SAYS to end with the review and that the allowlist still permits
      # what it needs. This step is the only thing in the repo that observes whether a comment ACTUALLY LANDED.
      #
      # Nothing above can see that on its own. `claude -p` exits 0 whatever it said, and
      # claude-code-action redacts its own log, so a review that fetched nothing, ended without the
      # marker, or never resolved `/verify-pr` as a slash command at all would otherwise end as a
      # green check with an empty PR — the silent no-post signature, which shipped past a fully
      # green CI once already. This step converts that entire class into a red job.
      #
      # MARKER-BASED, NOT IDENTITY-BASED, and it must stay that way: the comment's author is the
      # Claude App's bot, and `github-actions[bot]` is not unique to this job (any other workflow
      # commenting with the default GITHUB_TOKEN posts as that login), so a login filter could go
      # green on a run where this review posted nothing. The marker is minted by verify-pr.md and by
      # nothing else in this repo, so it identifies the artifact rather than the account.
      #
      # The id watermark is still needed alongside it: a re-run on a PR that was already reviewed
      # would otherwise be satisfied by the PREVIOUS run's marker comment. New AND marked, both.
      #
      # Not `if: always()`: a review or post step that failed outright already reddens the job and
      # would only add a confusing second error. The gap this closes is the SUCCESSFUL-but-silent run.
      - name: assert the review actually posted a comment
        id: assert
        # The probe's de-dup condition, verbatim, and it MUST stay identical: skipping the review
        # but not this assertion would demand a comment that was never going to be posted.
        # Gatehand's tests/workflows/review-dedup.test.sh pins the two together.
        if: github.event_name == 'workflow_dispatch' || steps.baseline.outputs.already_reviewed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          BASELINE: ${{ steps.baseline.outputs.id }}
          # Empty when the action never actually ran Claude: the probe found this workflow differs
          # from the default branch's copy, or the action skipped for a reason of its own.
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -euo pipefail
          # Keyed on the action producing no execution file rather than on the PR's changed-file
          # list: it covers every reason the review might not run, not just the edited workflow.
          # The note on the PR is the skip-note job's: this job's token cannot comment.
          if [[ -z "${EXECUTION_FILE:-}" ]]; then
            echo "::notice title=Review skipped::Claude never ran, so there is nothing to assert. On a PR that edits .github/workflows/claude-code-review.yml this is expected: the Claude App posts only for the default branch's copy of this file. Nothing re-runs it on its own: dispatch the review by hand, which works before merging because a dispatch runs the default branch's copy of this workflow."
            echo "skipped=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # THE marker, and the only copy of it in this file. Gatehand's tests/commands/verify-pr.test.sh
          # lifts the job-level line and asserts .claude/commands/verify-pr.md still tells the review to
          # emit the same string.
          marker="${REVIEW_MARKER}"
          # Default to 0 rather than interpolating an empty string into the jq filter: an empty
          # BASELINE would make this `select(.id > )`, a jq syntax error that reads as a broken
          # assertion instead of the review failure it is meant to report on.
          baseline="${BASELINE:-0}"
          # `.body // ""` because `null | contains("…")` is a jq ERROR, not false.
          posted="$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --paginate -X GET -f per_page=100 \
            --jq ".[] | select(.id > ${baseline}) | select((.body // \"\") | contains(\"${marker}\")) | .id" \
            | wc -l | tr -d ' ')"
          if [[ "${posted}" -gt 0 ]]; then
            echo "OK: ${posted} new comment(s) carrying ${marker} on PR #${PR} (baseline id ${baseline})."
            exit 0
          fi
          echo "::error title=Review posted nothing::the review ran but no new comment carrying the ${marker} marker appeared on PR #${PR} (nothing newer than comment id ${baseline})."
          echo "The job log is redacted by claude-code-action; the post step's errors above say why nothing was posted."
          exit 1

  # The "Claude did not review this PR" note, on an automatic run whose review never ran. Its own job
  # because it needs a token that can comment, and the review job's must not: the model runs there.
  # It checks out the default branch, never the PR, and runs no model.
  skip-note:
    needs: claude-review
    if: github.event_name == 'pull_request' && needs.claude-review.outputs.skipped == 'true'
    runs-on: @@RUNS_ON_REVIEW@@
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/install-gh
      - name: say the PR was not reviewed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The notice alone was not enough: the check is green either way, and a green check
          # reads as "reviewed". A large PR once merged that way with no review at all. So an
          # automatic run also says it on the PR, once -- the skip marker keeps a draft -> ready
          # toggle from posting it twice. It must NOT carry the review marker: the baseline step
          # and the agents' merge gate would then count this note as a review.
          skip_marker='<!-- verify-pr-skipped -->'
          noted="$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --paginate -X GET -f per_page=100 \
            --jq ".[] | select((.body // \"\") | contains(\"${skip_marker}\")) | .id" \
            | wc -l | tr -d ' ')"
          [[ "${noted}" -eq 0 ]] || exit 0
          # The backticks below are markdown for the comment, not command substitution.
          # shellcheck disable=SC2016
          printf '%s\n\n%s\n\n%s\n\n```bash\ngh workflow run "Claude Code Review" -f pr=%s\n```\n\n%s\n' \
            "${skip_marker}" \
            '**Claude did not review this PR.** The review was skipped without running Claude. The usual reason: this PR edits `.github/workflows/claude-code-review.yml`, and the Claude App posts reviews only for the copy of that file on the default branch.' \
            'Nothing runs the review later on its own. Ask for it by hand; this works before merging, because a dispatch runs the default branch'"'"'s copy of this workflow:' \
            "${PR}" \
            "Run log: ${RUN_URL}" \
            | gh pr comment "${PR}" --repo "${{ github.repository }}" --body-file -
