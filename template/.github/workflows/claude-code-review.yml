name: Claude Code Review
# QUOTED, and it has to stay that way: ` #` in an unquoted plain scalar opens a YAML comment, so
# the bare form silently parsed to "Claude review of PR" and dropped the expression entirely. That
# was survivable while this workflow was dispatch-only and ran rarely; with the automatic trigger
# below, an Actions list of identically-named runs has no way to say which PR each belongs to.
run-name: 'Claude review of PR #${{ inputs.pr || github.event.pull_request.number }}'

# The Claude review every PR gets, and the verdict the agents' merge gate reads
# (.github/scripts/agent-merge.sh): one summary comment carrying the review marker (REVIEW_MARKER
# below), whose Approve or Request changes line is that verdict. /verify-pr writes it as its final
# message, with no token that can write; the post-review job posts it as the Claude App (#1147).
#
# Runs on PR open and on a draft being marked ready. NOT on `synchronize`: it is not a required check,
# so a run per push would spend a runner on output nothing gates on. The fixer and the merge gate
# dispatch a fresh review themselves when a new head needs one (agent-state.sh request_review).
#
# DE-DUP: an automatic run skips when the PR already carries a review comment from the review bot, so
# draft -> ready -> draft -> ready reviews once. The gate is here, not in /verify-pr: it is
# deterministic and costs no tokens. A DISPATCH is exempt on purpose: it is a person (or the agents)
# asking for a fresh review.
#
# A FORK's PR is not reviewed here. A dispatch refuses it before anything from the PR is on disk (the
# fork guard step): the review runs the PR's own .github/actions and .claude/ with the Claude
# credential in reach. The automatic run skips it too, but only as a courtesy:
# on `pull_request` GitHub runs the PR's own copy of this file, which a fork can edit. What keeps
# that run harmless is GitHub's fork downgrade (no secrets, a read-only GITHUB_TOKEN), not this
# file, and only while a private repository's "Fork pull request workflows" settings send neither
# write tokens nor secrets. Fork code still runs on the review runner, so a public repository with
# a self-hosted review runner should choose "Require approval for all external contributors"
# (Settings, Actions, General); the default asks only for first-time contributors.
#
# Dispatch by hand, for a PR from a branch of this repository: gh workflow run "Claude Code Review" -f pr=<number>
on:
  pull_request:
    # NOT `synchronize` — see the header. `opened` and `ready_for_review` are the two moments a
    # review is worth its cost.
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review'
        required: true
        type: string

# THE marker, defined once for the whole workflow and read by both jobs. It was once spelled twice,
# inline in the baseline step's jq and again in the assert step, each pinned by its own test but never
# compared to the other, so changing one and not the other left de-dup silently never firing while
# every test stayed green. .claude/commands/verify-pr.md must emit this exact string; Gatehand's
# tests/commands/verify-pr.test.sh reads THIS line and checks the command against it.
env:
  REVIEW_MARKER: '<!-- verify-pr-review -->'

jobs:
  claude-review:
    runs-on: @@RUNS_ON_REVIEW@@
    env:
      REVIEW_BOT: '@@REVIEW_BOT_LOGIN@@'
    # GitHub fires `opened` for DRAFT PRs too. Until now that case was caught inside the
    # code-review plugin's own step 1, which this workflow no longer uses — so the guard has to be
    # here. Better placed anyway: the skip is visible in the workflow instead of being emergent
    # behaviour of a third-party command.
    # A fork's PR gets no secrets, so a review of it could only fail: it is skipped instead. A
    # dispatch has no pull_request payload for this to read; the fork guard step refuses it there.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    # A hung review holds its runner until this fires; on a small self-hosted review pool every later
    # PR queues behind it.
    timeout-minutes: 30
    # This token is the model's (the review step hands it over as github_token), so it is
    # read-only, and the job has NO id-token grant: with one, the OIDC request values would be in
    # the model's environment, and an OIDC token is what mints the Claude App's write token. The
    # post-review job, which runs no model, holds both.
    outputs:
      ran: ${{ steps.save.conclusion == 'success' }}
      claude_ran: ${{ steps.save.outputs.claude_ran }}
      baseline: ${{ steps.baseline.outputs.id }}
    permissions:
      contents: read
      pull-requests: read
      issues: read

    steps:
      # THE FORK GUARD: a dispatch for a fork's PR stops here, before the checkout below puts the
      # PR's head on disk. The steps after it run that tree's ./.github/actions/install-gh and read
      # its .claude/ (settings, /verify-pr) with the Claude credential in later steps' reach. From a branch of this repository that is code
      # from someone who could push here anyway; from a fork it is anyone's. To review a fork's PR,
      # read it, push its head to a branch here, and open a PR from that branch.
      # curl and jq, not gh: gh comes from install-gh, which needs the checkout this step guards.
      - name: refuse a fork's PR
        id: fork_guard
        if: github.event_name == 'workflow_dispatch'
        env:
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${PR}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr must be a PR number, not '${PR}'"; exit 1; }
          # The token goes to curl as config on stdin, never in argv.
          head="$(printf 'header = "Authorization: Bearer %s"\n' "${TOKEN}" \
            | curl -K - -fsSL --retry 3 --retry-all-errors --retry-delay 5 \
              -H 'Accept: application/vnd.github+json' "${GITHUB_API_URL}/repos/${REPO}/pulls/${PR}" \
            | jq -r '.head.repo.full_name // ""')"
          if [[ "${head}" != "${REPO}" ]]; then
            echo "::error::PR #${PR} comes from ${head:-a deleted fork}, not ${REPO}. A review runs the PR's own .github/actions and .claude/ with this job's tokens, so a fork's PR is not reviewed. Read it, push its head to a branch of ${REPO}, and review the PR from that branch."
            exit 1
          fi
          echo "PR #${PR} is from a branch of ${REPO}"

      # On a dispatch, check out the PR being reviewed. Without `ref:` a dispatch checks out the
      # ref it was run on (main), so the agent judged the PR's diff while every file it opened for
      # context was main's older copy ("checked against the code on the base branch"). The PR's HEAD, not its merge ref: refs/pull/N/merge is missing while
      # the PR conflicts, and the dispatch is the button pressed to re-review exactly then.
      # An automatic run passes '' here and keeps checkout's default, refs/pull/N/merge.
      # This runs the PR's own .github/actions/install-gh on a dispatch too, which the automatic
      # run has always done; .github/agents/protected-paths.txt is what keeps agent PRs out of it,
      # and the fork guard above is what keeps a fork's PR from reaching it.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/head', inputs.pr) || '' }}
          fetch-depth: 1

      # A bare self-hosted runner image ships no `gh`. See the action for the full reasoning and the
      # pin; every workflow that needs gh uses it, so the copies cannot drift.
      # Must come after checkout: it is a local action, read from the workspace.
      - uses: ./.github/actions/install-gh

      # Installation is only half of what the review needs. An unauthenticated `gh` looks
      # identical to a missing one: a green check and no review. The action prints the version;
      # this proves the token actually works before a billed review depends on it.
      - name: gh auth status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth status
      - name: record newest PR comment before the review
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same `inputs.pr || event` fallback as run-name and the prompt: this must work on the
          # workflow_dispatch path too, where there is no pull_request event payload.
          PR: ${{ inputs.pr || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Comment ids increase monotonically per repository, so "highest id seen before" is a
          # sufficient watermark and needs no timestamp parsing. `--paginate` matters: a PR with
          # more than 100 comments would otherwise watermark at the end of page one and every
          # later comment would read as "new". `${latest:-0}` covers a PR with no comments at all,
          # where the jq filter emits nothing and `tail -1` returns the empty string.
          # One fetch, two answers. `already_reviewed` is what stops a repeat review: the
          # code-review plugin this workflow replaced suppressed a review when the PR already
          # carried a Claude comment, and /verify-pr has no equivalent, so a PR toggled
          # draft -> ready -> draft -> ready used to get two full reviews. Deriving it from the
          # SAME response the watermark already needs keeps this at one API call.
          #
          # REVIEW_MARKER comes from the job-level env above — one definition, read by this step
          # and by the assert step, so the two cannot disagree.
          #
          # Only a marker in a comment by the review bot (REVIEW_BOT, policy.json reviewBotLogin)
          # counts as "already reviewed": anyone can comment on a PR, and a pasted marker would
          # otherwise suppress the automatic review. A review posted under another login just means
          # a second review, which fails safe. The watermark still counts every comment.
          rows="$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --paginate -X GET -f per_page=100 \
            --jq ".[] | [.id, (.user.login == \"${REVIEW_BOT}\" and ((.body // \"\") | contains(\"${REVIEW_MARKER}\")))] | @tsv")"
          latest="$(printf '%s\n' "${rows}" | cut -f1 | sort -n | tail -1)"
          # `if`, not `&&`: under `set -e` a bare `cmd && var=true` exits the step when cmd finds
          # nothing, which is the common no-prior-review case.
          reviewed=false
          if printf '%s\n' "${rows}" | cut -f2 | grep -qx true; then reviewed=true; fi
          echo "id=${latest:-0}" >> "$GITHUB_OUTPUT"
          echo "already_reviewed=${reviewed}" >> "$GITHUB_OUTPUT"
          echo "newest comment id on PR #${PR} before the review: ${latest:-none}"
          echo "a /verify-pr review already exists on PR #${PR}: ${reviewed}"

      # THE MODEL'S gh. The review reads the PR with `gh`, and plain `gh` is a way out: `--jq` and
      # `--template` evaluate jq and Go templates that can read the environment (`$ENV`, `env`), and a
      # URL argument or `--repo`/`--hostname` sends a request to a host the model names, with the
      # rest of the URL as a channel. So the model gets `review-gh` instead (the only gh its
      # --allowedTools name; plain `gh` is denied): it allows `pr view`, `pr diff`, `pr list`,
      # `issue view` and `search`, refuses those flags and any argument that is a URL or names a
      # host, pins the repository, and runs gh with an empty environment but for this job's
      # read-only token. Its source is this file, never the PR's tree.
      - name: the review's gh
        id: review_gh
        if: github.event_name == 'workflow_dispatch' || steps.baseline.outputs.already_reviewed != 'true'
        run: |
          set -euo pipefail
          real="$(command -v gh)"
          mkdir -p "$RUNNER_TEMP/review-bin"
          {
            printf '#!/usr/bin/env bash\nset -euo pipefail\nREAL_GH=%q\nREPO=%q\nHOST=%q\n' "${real}" "${GITHUB_REPOSITORY}" "${GITHUB_SERVER_URL#https://}"
            cat <<'WRAP'
          die() { echo "review-gh: $*" >&2; exit 2; }
          [[ $# -ge 1 ]] || die "usage: review-gh pr view|pr diff|pr list|issue view|search ..."
          case "$1 ${2:-}" in
            "pr view"|"pr diff"|"pr list"|"issue view") ;;
            "search prs"|"search issues"|"search code"|"search commits") ;;
            *) die "only pr view, pr diff, pr list, issue view and search are allowed" ;;
          esac
          host_re='^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+(:[0-9]+)?/'
          for a in "${@:3}"; do
            [[ ! "${a}" =~ ${host_re} ]] || die "an argument that names a host is not allowed"
            case "${a}" in
              --jq|--jq=*|-q|-q*|--template|--template=*|-t|-t*|--repo|--repo=*|-R|-R*|--hostname|--hostname=*|--web|-w|--browser*|--owner|--owner=*)
                die "${a%%=*} is not allowed here" ;;
              *://*|*@*:*) die "an argument that names a host is not allowed" ;;
            esac
          done
          cfg="$(mktemp -d)"
          trap 'rm -rf "${cfg}"' EXIT
          env -i PATH=/usr/bin:/bin HOME="${cfg}" GH_CONFIG_DIR="${cfg}" GH_HOST="${HOST}" GH_REPO="${REPO}" \
            GH_TOKEN="${GH_TOKEN:?}" GH_PROMPT_DISABLED=1 GH_NO_UPDATE_NOTIFIER=1 NO_COLOR=1 \
            "${REAL_GH}" "$@"
          WRAP
          } >"$RUNNER_TEMP/review-bin/review-gh"
          chmod 0755 "$RUNNER_TEMP/review-bin/review-gh"
          echo "$RUNNER_TEMP/review-bin" >>"$GITHUB_PATH"

      - name: Run Claude Code Review
        id: claude-review
        # De-dup. Skip when this PR already carries a /verify-pr review, so draft -> ready ->
        # draft -> ready does not review twice and an auto run followed by anything else does not
        # stack. A workflow_dispatch is exempt on purpose: a dispatch is a human pressing "review
        # this again", and silently ignoring that is worse than a duplicate. This condition is
        # duplicated on the save step below and on the post-review job's `ran` output, and the copies
        # MUST stay identical; Gatehand's tests/workflows/review-dedup.test.sh pins them together.
        if: github.event_name == 'workflow_dispatch' || steps.baseline.outputs.already_reviewed != 'true'
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          @@CLAUDE_AUTH@@
          # LOAD-BEARING for the autonomous agents. The action refuses any non-User actor not named
          # here (src/github/validation/actor.ts, checkHumanActor), and a PR the coder agent opens has
          # the actor `@@BOT_SLUG@@[bot]`. Without this line every agent PR would get NO review: the
          # step throws before Claude starts, and the review is the only qualitative gate before an
          # agent PR merges. One name, not `*`: allowed bots skip the write-permission check.
          allowed_bots: @@BOT_SLUG@@
          # THE MODEL HOLDS NO WRITE TOKEN (#1147). It reads text the PR's author wrote: on an agent
          # PR, a coder model steered by issue text anyone may have written. With no github_token the
          # action mints the Claude App's token (contents, issues and pull_requests write) and hands it
          # to the model as GH_TOKEN; a review that followed planted text could then post anything
          # anywhere, or hand the token out. This job's token is read-only and the job has no
          # id-token grant, so nothing here can mint a token that writes. The review comes back as
          # the model's final message, which the post-review job posts.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: '/verify-pr ${{ inputs.pr || github.event.pull_request.number }}'
          # Reads stop at the checkout, so /proc/self/environ (the Claude credential), $HOME and
          # $RUNNER_TEMP are out of reach; `Read(//proc/**)` says it again in case the setting goes.
          # `Edit(//**)` denies every file write, a shell redirect included (Claude Code checks one
          # against Edit rules), and deny beats any allow in the PR's own .claude/settings.json. The
          # model writes nothing at all: a write would be a way to steer a later step (GITHUB_ENV,
          # BASH_ENV, the saved review) or, on a self-hosted runner, a later job.
          settings: |
            {"permissions": {"blockReadsOutsideWorkingDirectories": true, "deny": ["Read(//proc/**)", "Edit(//**)"]}}
          # --allowedTools ALLOWS; it does not RESTRICT. In agent mode the action appends claude_args
          # to the CLI verbatim and adds no list of its own (src/modes/agent/index.ts), so a tool the
          # command needs and this line omits is not granted BY THE ACTION. Keep its review-gh verbs
          # equal to the gh calls in .claude/commands/verify-pr.md; Gatehand's
          # tests/commands/verify-pr.test.sh asserts they agree.
          #
          # The flag does not bound the grant: the checkout puts the PR's `.claude/settings.json` in
          # the workspace and Claude Code loads it, so the effective grant is this flag, that file's
          # `permissions.allow` and the command's frontmatter together. --disallowedTools is what
          # bounds it: it maps onto `deny`, and deny beats allow from every scope. Write, Edit and
          # NotebookEdit are denied by name, so the tools are gone; so is plain `gh` (the review uses
          # review-gh, above); the network tools so that it cannot send anything out; and git, the
          # package managers, build tools and interpreters so that a repo's settings cannot quietly
          # widen this job: it reads a diff and writes one message, and needs none of them. Bash rules
          # are SCOPED (`Bash(git:*)`), never a bare `Bash`, which would take review-gh with it.
          #
          # No Task: /verify-pr is a single-pass review.
          # MODEL, set explicitly (policy.json roles.review.model, rendered here): without --model
          # the CLI default applies, which can be a smaller model than the one the merge gate is
          # meant to trust. Gatehand's tests/commands/verify-pr.test.sh pins it. claude-code-action installs its
          # own pinned CLI, so after changing the model, dispatch a review and check that the agent
          # step ran more than one turn before trusting it: a model the CLI does not know dies on its
          # first request with no comment.
          claude_args: |
            --model @@REVIEW_MODEL@@
            --allowedTools "Read,Grep,Glob,TodoWrite,Bash(review-gh pr view:*),Bash(review-gh pr diff:*),Bash(review-gh pr list:*),Bash(review-gh issue view:*),Bash(review-gh search:*)"
            --disallowedTools "Write,Edit,NotebookEdit,Bash(gh:*),Bash(pnpm:*),Bash(npm:*),Bash(npx:*),Bash(yarn:*),Bash(bun:*),Bash(go:*),Bash(gofmt:*),Bash(cargo:*),Bash(pip:*),Bash(uv:*),Bash(python:*),Bash(python3:*),Bash(node:*),Bash(make:*),Bash(git:*),Bash(docker:*),Bash(curl:*),Bash(wget:*),Bash(env:*),Bash(printenv:*),Bash(cat:*),WebFetch,WebSearch"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The model has exited. Its final message (the `result` of the execution file) is the review;
      # it goes to the post-review job as an artifact, whatever it says: that job, which runs no
      # model and no code from the PR, decides whether it can be posted. An empty file when Claude
      # never ran or said nothing: the post job tells the two apart by `claude_ran`.
      - name: save the review for the post job
        id: save
        if: github.event_name == 'workflow_dispatch' || steps.baseline.outputs.already_reviewed != 'true'
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/verify-pr-review"
          mkdir -p "$RUNNER_TEMP/verify-pr-review"
          if [[ -n "${EXECUTION_FILE:-}" && -s "${EXECUTION_FILE}" ]]; then
            jq -r '[.[]? | select(.type? == "result")] | last | .result // empty' "${EXECUTION_FILE}" >"$RUNNER_TEMP/verify-pr-review/final.md"
            echo "claude_ran=true" >>"$GITHUB_OUTPUT"
          else
            : >"$RUNNER_TEMP/verify-pr-review/final.md"
            echo "::notice title=Review skipped::Claude never ran, so there is nothing to post. Nothing re-runs it on its own: dispatch the review by hand."
            echo "claude_ran=false" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || steps.baseline.outputs.already_reviewed != 'true'
        with:
          name: verify-pr-review
          path: ${{ runner.temp }}/verify-pr-review
          retention-days: 7
          if-no-files-found: error

  # THE POST. Runs no model and nothing from the PR (no checkout): it downloads the review job's
  # final message and posts it to this run's PR, never one the text names, as the Claude App, whose
  # login (the review bot) the de-dup, the merge gate and the fixer read. The token comes from
  # exchanging this job's OIDC token at Anthropic, as claude-code-action itself does when it is
  # given no github_token, for pull_requests write only; it is used for one comment and revoked.
  # The exchange refuses when this file differs from the default branch's copy ("workflow
  # validation"): a PR that edits it gets the "not reviewed" note instead. The merge gate and the
  # fixer read a review's time window from the claude-review job's start to this job's end
  # (agent-state.sh review_attribution), so keep both job names.
  post-review:
    needs: claude-review
    if: needs.claude-review.outputs.ran == 'true'
    runs-on: @@RUNS_ON_REVIEW@@
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verify-pr-review
          path: ${{ runner.temp }}/verify-pr-review
      - name: post the review
        id: post
        env:
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          CLAUDE_RAN: ${{ needs.claude-review.outputs.claude_ran }}
          BASELINE: ${{ needs.claude-review.outputs.baseline }}
          FINAL: ${{ runner.temp }}/verify-pr-review/final.md
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "${PR}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::pr must be a PR number, not '${PR}'"; exit 1; }
          [[ "${BASELINE:-0}" =~ ^[0-9]+$ ]] || BASELINE=0
          # ghapi <token> <method> <path> [data-file]: the GitHub API, token as curl config on stdin.
          ghapi() {
            printf 'header = "Authorization: Bearer %s"\n' "$1" \
              | curl -K - -fsS -X "$2" -H 'Accept: application/vnd.github+json' ${4:+--data-binary "@$4"} "${GITHUB_API_URL}$3"
          }
          # comment_ids <jq filter on one comment>: ids of this PR's comments that match, every page.
          comment_ids() {
            local page=1 got
            while :; do
              got="$(ghapi "${GH_API_TOKEN}" GET "/repos/${REPO}/issues/${PR}/comments?per_page=100&page=${page}")"
              jq -r ".[] | select($1) | .id" <<<"${got}"
              [[ "$(jq length <<<"${got}")" -eq 100 ]] || break
              page=$((page + 1))
            done
          }
          # The "Claude did not review this PR" note, once per PR, on an automatic run only (whoever
          # dispatched a run is watching it). It must NOT carry the review marker: the de-dup and the
          # merge gate would then count it as a review.
          skip_note() { # <why>
            [[ "${EVENT}" == pull_request ]] || return 0
            local skip_marker='<!-- verify-pr-skipped -->' note
            [[ -z "$(comment_ids "(.body // \"\") | contains(\"${skip_marker}\")")" ]] || return 0
            note="$(mktemp)"
            # The backticks below are markdown for the comment, not command substitution.
            # shellcheck disable=SC2016
            printf '%s\n\n**Claude did not review this PR.** %s\n\n%s\n\n```bash\ngh workflow run "Claude Code Review" -f pr=%s\n```\n\nRun log: %s\n' \
              "${skip_marker}" "$1" \
              'Nothing runs the review later on its own. Ask for it by hand; this works before merging, because a dispatch runs the default branch'"'"'s copy of this workflow:' \
              "${PR}" "${RUN_URL}" | jq -Rs '{body: .}' >"${note}"
            ghapi "${GH_API_TOKEN}" POST "/repos/${REPO}/issues/${PR}/comments" "${note}" >/dev/null
          }
          if [[ "${CLAUDE_RAN}" != true ]]; then
            echo "::notice title=Review skipped::Claude never ran, so there is nothing to post."
            skip_note 'The review was skipped without running Claude.'
            exit 0
          fi
          # From the marker line on: /verify-pr puts it first, so anything before it is not the review.
          body="$(mktemp)"
          tr -d '\r' <"${FINAL}" | awk -v m="${REVIEW_MARKER}" 'on || index($0, m) == 1 { on = 1; print }' >"${body}"
          if [[ ! -s "${body}" ]]; then
            echo "::error title=Review posted nothing::the review's final message carries no line starting with ${REVIEW_MARKER}, so there is nothing to post. The job log of the review is redacted by claude-code-action; likely causes: /verify-pr did not resolve as a slash command, the model ran out of turns, or it ended with something other than the review."
            exit 1
          fi
          if [[ "$(wc -c <"${body}" | tr -d ' ')" -gt 60000 ]]; then
            echo "::error title=Review not posted::the review is over 60000 bytes; nothing was posted."
            exit 1
          fi
          # Shapes of the credentials a review job could reach. A real review has no reason to
          # carry one, and a review that does is posting a secret. Defence in depth: the boundary is
          # that the model can neither read its environment nor send anything out.
          if grep -qE 'sk-ant-[A-Za-z0-9_-]{8}|gh[opsur]_[A-Za-z0-9]{20}|github_pat_[A-Za-z0-9_]{20}|-----BEGIN [A-Z ]*PRIVATE KEY|ACTIONS_(ID_TOKEN_REQUEST|RUNTIME)_TOKEN|eyJ[A-Za-z0-9_-]{20,}\.eyJ' "${body}"; then
            echo "::error title=Review not posted::the review carries text shaped like a credential, so it was not posted. Read the run's artifact before trusting this PR."
            exit 1
          fi
          # The token exchange. The two OIDC request values go to curl as config on stdin.
          oidc="$(printf 'header = "Authorization: bearer %s"\nurl = "%s&audience=claude-code-github-action"\n' \
            "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?the job needs id-token: write}" "${ACTIONS_ID_TOKEN_REQUEST_URL:?}" \
            | curl -K - -fsS --retry 3 --retry-all-errors --retry-delay 5 | jq -r '.value // empty')"
          [[ -n "${oidc}" ]] || { echo "::error::no OIDC token from the runner"; exit 1; }
          echo "::add-mask::${oidc}"
          code=0
          resp="$(printf 'header = "Authorization: Bearer %s"\nheader = "Content-Type: application/json"\n' "${oidc}" \
            | curl -K - -sS --retry 3 --retry-delay 5 -o - -w '\n%{http_code}' -X POST \
              --data '{"permissions":{"pull_requests":"write"}}' \
              'https://api.anthropic.com/api/github/github-app-token-exchange')" || code=$?
          [[ "${code}" -eq 0 ]] || { echo "::error::the Claude App token exchange could not be reached (curl ${code})"; exit 1; }
          status="${resp##*$'\n'}"
          json="${resp%$'\n'*}"
          if [[ "${status}" != 200 ]]; then
            err="$(jq -r '(.error.details.error_code // "") + " " + (.error.message // "") + " " + (.message // "")' <<<"${json}" 2>/dev/null | tr '[:upper:]' '[:lower:]' || true)"
            if [[ "${err}" == *workflow_not_found_on_default_branch* || ( "${status}" == 401 && "${err}" == *"workflow validation failed"* ) ]]; then
              echo "::notice title=Review not posted::this workflow differs from the default branch's copy, so the Claude App will not post for it."
              # The backticks are markdown for the comment, not command substitution.
              # shellcheck disable=SC2016
              skip_note 'The review ran, but the Claude App posts only for the default branch'"'"'s copy of `.github/workflows/claude-code-review.yml`, and this PR edits it.'
              exit 0
            fi
            echo "::error::the Claude App token exchange answered ${status}; nothing was posted"
            exit 1
          fi
          tok="$(jq -r '.token // .app_token // empty' <<<"${json}")"
          [[ -n "${tok}" ]] || { echo "::error::the token exchange answered 200 with no token"; exit 1; }
          echo "::add-mask::${tok}"
          revoke() { ghapi "${tok}" DELETE /installation/token >/dev/null 2>&1 || true; }
          trap revoke EXIT
          jq -Rs '{body: .}' <"${body}" >"${body}.json"
          # No retry: a POST that timed out may have landed, and a second would double the review.
          ghapi "${tok}" POST "/repos/${REPO}/issues/${PR}/comments" "${body}.json" >/dev/null
          revoke
          trap - EXIT
          # I3 ASSERTION. The review is only done when a NEW comment carrying the marker is on the
          # PR: new (above the baseline id the review job read before the review, so a re-run is not
          # satisfied by the previous run's comment) AND marked (the marker identifies the artifact,
          # not the account: `github-actions[bot]` is not unique to this job). A post that returned
          # 2xx and left nothing behind reddens the job instead of ending green with no review.
          if [[ -n "$(comment_ids ".id > ${BASELINE} and ((.body // \"\") | contains(\"${REVIEW_MARKER}\"))")" ]]; then
            echo "posted the review on PR #${PR}"
            exit 0
          fi
          echo "::error title=Review posted nothing::the comment was sent, but no new comment carrying ${REVIEW_MARKER} is on PR #${PR}."
          exit 1
