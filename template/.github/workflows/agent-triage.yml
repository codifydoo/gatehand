name: Agent triage
run-name: "Agent triage: ${{ github.event_name == 'issues' && format('issue {0}', github.event.issue.number) || (inputs.issue != '' && format('issue {0}', inputs.issue) || 'every open security issue') }}"

# Triage without a model (.github/scripts/agent-triage.sh has the rules): a Low or Medium Claude
# Security finding that a person with write access imported is queued for the coder (agent:ready,
# size: S); a High or Critical one is marked agent:candidate for a person to decide; one that a
# merged PR already names gets a comment instead, since it is probably fixed and waiting for a prod
# check. One marker comment per issue, so nothing is triaged twice.
# Design: .github/agents/README.md. Runbook: .github/agents/README.md.
#
# Daily, on every new issue that carries the `security` label, and by dispatch (empty = every open
# security issue, which is also the backfill). Behind AGENTS_ENABLED; on the agent pool, because it
# mints the App token. Nothing from an issue is executed: the script parses the body with jq.
on:
  schedule:
    # 05:17 UTC, before the coder's first scheduled kick at 06:17.
    - cron: "@@CRON_TRIAGE@@"
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: One issue to triage (empty triages every open security issue)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: agent-triage
  cancel-in-progress: false

jobs:
  triage:
    name: triage
    # A new issue only when it is labelled `security`; the import applies the label at creation.
    if: >-
      vars.AGENTS_ENABLED == 'true' && (
        github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'security')
      )
    runs-on: @@RUNS_ON_AGENT@@
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/install-gh
      # issues: the labels and the marker comment. contents + pull-requests (read): the trust and
      # cross-reference reads the coder's preflight makes with the same set.
      - name: agent App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read
      - name: gh auth status
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh auth status
      - name: triage
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          # Not the new issue's number: GitHub keeps one pending run per concurrency group and cancels
          # the older, so after a batch import most event runs are dropped. Each run covers every
          # open security issue, and the one that survives covers the dropped ones.
          ISSUE: ${{ inputs.issue }}
        run: bash .github/scripts/agent-triage.sh run "$ISSUE"
